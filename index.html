<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="BDIX Hub TV — a fast, remote-friendly launcher for BDIX media, FTP and live TV servers on Android TV.">
<title>BDIX Hub TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f59e0b'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3Cpath d='M10 10a8.5 8.5 0 0 0 0 12M22 10a8.5 8.5 0 0 1 0 12' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Optional font: loads in the background, the page never waits for it and falls back to the system font offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">

<style>
/* ===== Tokens ===== */
:root{
  --ink:#060a13; --txt:#e8edf6; --mut:#9aa8c0; --dim:#7b8aa5;
  --line:rgba(148,163,184,.16); --amber:#fbbf24;
  --cy:#22d3ee; --pk:#f472b6; --vi:#a78bfa; --gn:#34d399;
  --mx:40px; --ts:1;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono","Droid Sans Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(16px*var(--ts));-webkit-text-size-adjust:100%}
@media (min-width:1280px){html{font-size:calc(18px*var(--ts))}}
@media (min-width:1700px){html{font-size:calc(21px*var(--ts))}}
body{
  margin:0;background:var(--ink);color:var(--txt);line-height:1.35;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden;
}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60rem 30rem at 8% -12%,rgba(251,191,36,.14),transparent 60%),
  radial-gradient(50rem 32rem at 98% 0%,rgba(34,211,238,.09),transparent 60%),
  radial-gradient(46rem 38rem at 50% 118%,rgba(244,114,182,.08),transparent 60%),var(--ink)}
a{color:inherit;text-decoration:none;-webkit-user-drag:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
h1,h2,h3,p{margin:0}
.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
.i.fill{fill:currentColor}
.am{color:var(--amber)}

/* ===== Layout ===== */
.wrap{max-width:92rem;margin:0 auto;padding:1.1rem var(--mx) 4.4rem}
section{margin-bottom:1.3rem}

/* ===== Focus system (one ring everywhere) ===== */
.f{position:relative;outline:none}
.f:focus{outline:none;box-shadow:0 0 0 .2rem var(--amber),0 .5rem 1.4rem rgba(0,0,0,.55)!important;border-color:var(--amber)!important;z-index:5}
.fx .f{transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease,background-color .14s ease}
.fx .f:focus{transform:scale(1.035)}
.fx .tab:focus,.fx .sg:focus,.fx .btn:focus,.fx .ib:focus{transform:scale(1.05)}
body.mouse .f:focus{box-shadow:none!important;transform:none}

/* ===== Header ===== */
.hdr{display:grid;grid-template-columns:1fr auto;align-items:center;grid-gap:1rem;padding:.2rem 0 .9rem}
.brand{display:grid;grid-template-columns:auto 1fr;align-items:center;grid-gap:.9rem;min-width:0}
.logo{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;color:#fff;transform:rotate(4deg);
  background:linear-gradient(135deg,#fbbf24,#f97316 55%,#f43f5e);box-shadow:0 0 1.5rem rgba(249,115,22,.4)}
.logo .i{width:1.6rem;height:1.6rem;transform:rotate(-4deg)}
.ttl{display:flex;align-items:center}
h1{font-size:1.55rem;font-weight:800;letter-spacing:-.01em;line-height:1;color:#fff}
h1 span{background:linear-gradient(90deg,#fcd34d,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.pill{margin-left:.75rem;font-size:.7rem;font-weight:800;letter-spacing:.08em;padding:.2rem .6rem;border-radius:99px;
  color:#fcd34d;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);white-space:nowrap}
.tagline{margin-top:.4rem;font-size:.88rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:grid;grid-auto-flow:column;align-items:center;grid-gap:1.1rem}
.clock{text-align:right;line-height:1.15}
.clock b{display:block;font-family:var(--mono);font-size:1.35rem;font-weight:700;color:#fcd34d}
.clock span{font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.ib{width:3.1rem;height:3.1rem;border-radius:1rem;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cbd5e1;font-size:1.3rem}

/* ===== Search / URL bar ===== */
.bar{display:grid;grid-template-columns:1.25fr 1fr auto;grid-gap:.8rem;padding:.8rem;margin-bottom:.8rem;border-radius:1.4rem;
  background:rgba(13,20,36,.88);border:1px solid var(--line)}
.fld{position:relative;min-width:0}
.fld>.i{position:absolute;left:1rem;top:50%;margin-top:-.6rem;width:1.2rem;height:1.2rem;color:var(--mut);pointer-events:none}
.inp{display:block;width:100%;height:3.2rem;padding:0 3.2rem 0 2.9rem;border-radius:1rem;border:1px solid var(--line);background:rgba(0,0,0,.38);
  color:#fff;font-family:inherit;font-size:1rem;font-weight:600;-webkit-user-select:text;user-select:text}
.inp::placeholder{color:var(--dim);font-weight:500}
.inp.mono{font-family:var(--mono);font-size:.95rem;color:#a5f3fc;padding-right:1rem}
.clr{position:absolute;right:.45rem;top:.45rem;width:2.3rem;height:2.3rem;border-radius:.8rem;display:grid;place-items:center;color:var(--mut);background:rgba(255,255,255,.07);font-size:1.15rem}
.go{height:3.2rem;padding:0 1.5rem;border-radius:1rem;display:grid;grid-auto-flow:column;align-items:center;grid-gap:.55rem;
  background:linear-gradient(90deg,#fbbf24,#f97316);color:#1a1205;font-weight:800;font-size:1rem;letter-spacing:.04em;border:1px solid transparent}

/* ===== Horizontal rails (tabs + posters) ===== */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:max-content;grid-gap:.8rem;overflow-x:auto;overflow-y:hidden;
  padding:.8rem var(--mx);margin:-.8rem calc(var(--mx)*-1);scrollbar-width:none;-ms-overflow-style:none}
.rail::-webkit-scrollbar{display:none}
.rail::after{content:"";display:block;width:calc(var(--mx) - .8rem);height:1px}
.fx .rail{scroll-behavior:smooth}
.rail.pr{grid-auto-columns:15rem}
.tabs{margin-bottom:.3rem}
.tab{height:2.9rem;padding:0 1.15rem;border-radius:99px;display:grid;grid-auto-flow:column;align-items:center;grid-gap:.55rem;
  font-size:.95rem;font-weight:800;white-space:nowrap;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dbe4f3}
.tab .n{font-family:var(--mono);font-size:.78rem;font-weight:700;opacity:.7}
.tab.on{background:var(--amber);color:#1a1205;border-color:var(--amber)}
.tab.on .i{color:inherit!important}
.c-cy{color:var(--cy)}.c-pk{color:var(--pk)}.c-gn{color:var(--gn)}.c-vi{color:var(--vi)}.c-am{color:var(--amber)}

/* ===== Section heading ===== */
.sh{display:flex;align-items:center;margin-bottom:.75rem;font-size:.95rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#dbe4f3}
.sh .i{width:1.15rem;height:1.15rem;margin-right:.6rem}
.sh i{flex:1;height:1px;margin:0 1rem;background:linear-gradient(90deg,rgba(255,255,255,.2),transparent)}
.sh .meta{font-family:var(--mono);font-size:.85rem;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut);white-space:nowrap}
.sh .meta b{color:#fff}.sh .meta b.am{color:var(--amber)}

/* ===== Posters (rails) ===== */
.poster{display:flex;flex-direction:column;justify-content:space-between;height:8.6rem;padding:.9rem;border-radius:1.15rem;overflow:hidden;color:#fff;
  border:1px solid rgba(255,255,255,.16)}
.poster::before{content:"";position:absolute;left:0;right:0;bottom:0;top:25%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.62))}
.poster>*{position:relative}
.pt{align-self:flex-start;font-size:.7rem;font-weight:800;letter-spacing:.1em;padding:.2rem .55rem;border-radius:.5rem;background:rgba(0,0,0,.42)}
.pi{display:block;font-size:.84rem;font-weight:600;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:1.08rem;font-weight:800;line-height:1.15}
.poster>.pf{position:absolute;right:.8rem;top:.8rem;width:1.3rem;height:1.3rem;color:var(--amber)}

/* ===== Server grid + cards ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));grid-gap:1rem}
.dense .grid{grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr))}
.item{position:relative}
.card{display:grid;grid-template-columns:3.5rem 1fr;align-items:center;grid-gap:.9rem;min-height:5.8rem;padding:.8rem .95rem;border-radius:1.15rem;
  border:1px solid var(--line);background:linear-gradient(180deg,#15203a,#0f182c);box-shadow:0 .35rem 1rem rgba(0,0,0,.3)}
.dense .card{grid-template-columns:3rem 1fr;grid-gap:.75rem;padding:.7rem .75rem}
.dense .av{width:3rem;height:3rem;font-size:1rem}
.av{position:relative;width:3.5rem;height:3.5rem;border-radius:1.05rem;display:grid;place-items:center;font-size:1.1rem;font-weight:800;color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.av.lg{width:4rem;height:4rem;font-size:1.25rem}
.avb{position:absolute;right:-.35rem;bottom:-.35rem;width:1.4rem;height:1.4rem;border-radius:50%;display:grid;place-items:center;background:#0b1222;border:2px solid #15203a;font-size:.68rem}
.avb.tv{color:var(--pk)}.avb.md{color:var(--cy)}
.cb{display:block;min-width:0}
.cn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:1.08rem;font-weight:800;line-height:1.2;color:#fff}
.cn .nf{width:.95rem;height:.95rem;margin-right:.35rem;color:var(--amber);vertical-align:-.1em}
.ci{display:block;margin-top:.15rem;font-size:.86rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl{display:flex;align-items:center;justify-content:space-between;margin-top:.2rem}
.ch{flex:1;min-width:0;font-family:var(--mono);font-size:.82rem;font-weight:600;color:#67e8f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{flex:none;margin-left:.6rem;padding:.1rem .5rem;border-radius:.5rem;font-size:.74rem;font-weight:800;color:#fcd34d;background:rgba(251,191,36,.12)}
.opt{display:none;position:absolute;right:.6rem;bottom:.6rem;width:2.5rem;height:2.5rem;border-radius:.85rem;place-items:center;z-index:2;
  background:rgba(0,0,0,.45);border:1px solid var(--line);color:#e2e8f0;font-size:1.2rem}
.show-opt .opt,.mouse .item:hover .opt{display:grid}
.show-opt .card{padding-right:3.7rem}

.empty{text-align:center;padding:3.5rem 1rem}
.empty .big{width:5rem;height:5rem;margin:0 auto 1rem;border-radius:1.5rem;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);font-size:2rem}
.empty h3{font-size:1.25rem;font-weight:800;color:#fff;margin-bottom:.3rem}
.empty p{font-size:.95rem;color:var(--mut)}
.empty .btn{margin-top:1.1rem}

/* ===== Buttons ===== */
.btn{height:2.9rem;padding:0 1.2rem;border-radius:.95rem;display:inline-grid;grid-auto-flow:column;align-items:center;grid-gap:.55rem;white-space:nowrap;
  font-size:.95rem;font-weight:800;color:#1a1205;background:var(--amber);border:1px solid var(--amber)}
.btn.ghost{color:#e2e8f0;background:rgba(255,255,255,.07);border-color:var(--line)}
.btn .am{color:inherit}

/* ===== Overlay panels (server options + settings) ===== */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:grid;place-items:center;padding:1rem var(--mx) 3.2rem;background:rgba(3,6,12,.84)}
.panel{width:100%;max-width:56rem;max-height:100%;overflow-y:auto;padding:1.3rem;border-radius:1.6rem;scrollbar-width:none;
  background:linear-gradient(180deg,#131d35,#0d1527);border:1px solid rgba(255,255,255,.12);box-shadow:0 2rem 5rem rgba(0,0,0,.7)}
.panel::-webkit-scrollbar{display:none}
.ph{display:grid;grid-template-columns:auto 1fr auto;align-items:center;grid-gap:1rem;margin-bottom:1.1rem}
.ph .pht{grid-column:2;min-width:0}
.ph>.pha:last-child{grid-column:3}
.ph h2{font-size:1.4rem;font-weight:800;color:#fff;line-height:1.15}
.ph p{margin-top:.2rem;font-size:.9rem;color:var(--mut)}
.pha{display:grid;grid-auto-flow:column;grid-gap:.6rem}
.lh2{margin-bottom:.7rem;font-size:.9rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#dbe4f3}
.lh2 b{color:var(--amber)}
.lh2 span{margin-left:.8rem;font-size:.82rem;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));grid-gap:.7rem;padding:.3rem}
.lr{display:grid;grid-template-columns:1.4rem 1fr auto;align-items:center;grid-gap:.7rem;padding:.85rem .95rem;border-radius:1rem;
  background:rgba(255,255,255,.045);border:1px solid var(--line)}
.lr .li{color:var(--mut);font-size:1.15rem}
.lr .lt{min-width:0;font-family:var(--mono);font-size:.95rem;font-weight:700;color:#e8edf6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr.def{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.07)}
.lg{display:grid;grid-auto-flow:column;grid-gap:.35rem}
.tg{font-style:normal;font-size:.68rem;font-weight:800;letter-spacing:.06em;padding:.12rem .45rem;border-radius:.45rem;background:rgba(255,255,255,.08);color:#cbd5e1}
.tg.ip{color:#67e8f9;background:rgba(34,211,238,.12)}.tg.hs{color:#6ee7b7;background:rgba(52,211,153,.12)}.tg.df{color:#1a1205;background:var(--amber)}
.pfoot{margin-top:1rem}
.srow{display:grid;grid-template-columns:1fr auto;align-items:center;grid-gap:1rem;padding:.8rem .3rem;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.st b{display:block;font-size:1.02rem;font-weight:800;color:#fff}
.st small{display:block;margin-top:.15rem;font-size:.84rem;color:var(--mut);max-width:30rem}
.seg{display:grid;grid-auto-flow:column;grid-gap:.5rem;padding:.3rem}
.sg{height:2.7rem;padding:0 1rem;border-radius:.9rem;white-space:nowrap;font-size:.92rem;font-weight:800;color:#dbe4f3;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.sg.on{background:var(--amber);color:#1a1205;border-color:var(--amber)}
.about{margin-top:.8rem;text-align:center;font-family:var(--mono);font-size:.8rem;color:var(--dim)}

/* ===== Hint bar + toast ===== */
.hints{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:space-between;align-items:center;padding:.5rem var(--mx);
  background:rgba(6,10,19,.94);border-top:1px solid var(--line);font-size:.82rem;color:var(--mut)}
.hk{margin-right:1.3rem;white-space:nowrap}
.hk kbd{display:inline-block;margin-right:.45rem;padding:.12rem .55rem;border-radius:.5rem;background:rgba(255,255,255,.07);border:1px solid var(--line);
  font-family:var(--mono);font-size:.75rem;font-weight:700;color:#fcd34d}
.ver{font-family:var(--mono);font-size:.75rem;color:var(--dim);white-space:nowrap}
.toast{position:fixed;top:1rem;left:50%;z-index:80;max-width:80vw;display:none;align-items:center;padding:.7rem 1.3rem .7rem .8rem;border-radius:1.1rem;
  background:rgba(13,20,36,.97);border:2px solid var(--amber);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 1rem 2.4rem rgba(0,0,0,.6);
  transform:translateX(-50%);pointer-events:none}
.toast.show{display:flex}
.toast .tI{width:2rem;height:2rem;margin-right:.75rem;border-radius:.7rem;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.toast span.tM{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .toast.show{animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-.6rem)}to{opacity:1;transform:translate(-50%,0)}}
.fx .spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .bar{grid-template-columns:1fr}
  .clock{display:none}
  .hints .ver{display:none}
}
</style>
</head>

<div id="bg"></div>

<script>
(function(){
'use strict';

/* ==================== CONSTANTS ==================== */
var PICKS=['m_sam','m_circle','m_ftpbd','tv_bioscope','tv_jagobd','m_discovery','tv_ctgtv','m_khulnaflix','tv_amrbd','m_showtime'];
var IPRE=/^https?:\/\/\d{1,3}(\.\d{1,3}){3}/;
var TABS=[
  {k:'all',   l:'All',          i:'grid',   c:''},
  {k:'media', l:'Media & FTP',  i:'folder', c:'c-cy'},
  {k:'tv',    l:'Live TV',      i:'tv',     c:'c-pk'},
  {k:'ip',    l:'Direct IP',    i:'wifi',   c:'c-gn'},
  {k:'favs',  l:'Favorites',    i:'star',   c:'c-am'},
  {k:'recent',l:'Recent',       i:'clock',  c:'c-vi'}
];
var TITLES={all:'All Servers',media:'Media & FTP Servers',tv:'Live TV & IPTV',ip:'Direct IP Access',favs:'Your Favorites',recent:'Recently Opened'};
var SET=[
  {k:'ts',t:'Text size',d:'Makes everything bigger or smaller.',o:[[1,'Normal'],[1.15,'Large'],[1.3,'Extra large']]},
  {k:'dn',t:'Card size',d:'Large cards are easier to read. Compact fits more on screen.',o:[[0,'Large'],[1,'Compact']]},
  {k:'mx',t:'Screen margin',d:'Increase this if the edges of the page are cut off by your TV.',o:[[20,'Small'],[40,'Medium'],[64,'Large']]},
  {k:'fx',t:'Visual effects',d:'Switch to Reduced if scrolling ever feels slow.',o:[[1,'Full'],[0,'Reduced']]},
  {k:'opt',t:'Options button on cards',d:'Adds a ⋯ button to each card. Turn on if Hold OK does not work on your remote.',o:[[0,'Off'],[1,'On']]}
];
var HINTS={
  nav:[['▲▼◀▶','Move'],['OK','Select'],['Back','Top / Exit']],
  card:[['▲▼◀▶','Move'],['OK','Open'],['Hold OK','Mirrors & ★'],['Back','Top']],
  inp:[['OK','Type'],['▼','Results'],['Back','Done']],
  ov:[['▲▼◀▶','Move'],['OK','Select'],['Back','Close']]
};
var KEYDIR={37:'left',38:'up',39:'right',40:'down',ArrowLeft:'left',ArrowUp:'up',ArrowRight:'right',ArrowDown:'down'};

/* ==================== HELPERS ==================== */
function $(id){return document.getElementById(id);}
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return ESC[c];});}
function ico(n,c){return '<svg class="i'+(c?' '+c:'')+'" aria-hidden="true" focusable="false"><use href="#i-'+n+'"/></svg>';}
function label(u){return u.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,'');}
function hue(str){var h=0;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h%360;}
function initials(name){
  var w=name.replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(function(x){return /[A-Za-z0-9]/.test(x);});
  if(!w.length)return '?';
  if(w.length===1)return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[1][0]).toUpperCase();
}
function avatar(id){var h=hue(id);return 'background:linear-gradient(135deg,hsl('+h+',68%,46%),hsl('+((h+45)%360)+',68%,24%))';}
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

/* ==================== STATE ==================== */
var BY={},TOTAL=0;
DATA.forEach(function(s){
  BY[s.id]=s;
  s._all=[s.url].concat(s.altUrls||[]);
  TOTAL+=s._all.length;
  s._ip=s._all.some(function(u){return IPRE.test(u);});
  s._hay=(s.name+' '+s.isp+' '+s._all.join(' ')+' '+(s.category==='tv'?'live tv iptv channels':'media ftp movies emby jellyfin')).toLowerCase();
});

var favs=LS.get('bdix_hub_favs',[]).filter(function(id){return BY[id];});
var recents=LS.get('bdix_hub_recent',[]).filter(function(id){return BY[id];});
var prefs=LS.get('bdix_hub_pref',{});
var reduce=false;try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
var old=LS.get('bdix_hub_settings',{});
var cfg={ts:1,dn:0,mx:old.overscan?64:40,fx:reduce?0:1,opt:0};
var saved=LS.get('bdix_hub_cfg',{});for(var k in saved){if(saved.hasOwnProperty(k))cfg[k]=saved[k];}

var cat='all',query='',ovOpen=false,ovKind='',ovFrom=null,opening=false;
function isFav(id){return favs.indexOf(id)>-1;}
function openUrl(s){var p=prefs[s.id];return(p&&s._all.indexOf(p)>-1)?p:s.url;}
function aria(s){var n=s._all.length;return s.name+', '+(s.category==='tv'?'Live TV':'Media and FTP')+', '+n+(n>1?' links':' link')+(isFav(s.id)?', favorite':'');}

/* ==================== SETTINGS ==================== */
function applyCfg(){
  var r=document.documentElement,b=document.body;
  r.style.setProperty('--ts',cfg.ts);
  r.style.setProperty('--mx',cfg.mx+'px');
  b.classList.toggle('fx',!!cfg.fx);
  b.classList.toggle('dense',cfg.dn===1);
  b.classList.toggle('show-opt',!!cfg.opt);
}

/* ==================== CLOCK / TOAST ==================== */
function tick(){
  var n=new Date(),h=n.getHours(),m=n.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;
  $('clk').textContent=h+':'+(m<10?'0'+m:m)+' '+ap;
  $('dte').textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
var toastT;
function toast(msg,icon,color){
  var t=$('toast');
  $('tM').textContent=msg;
  $('tI').innerHTML=ico(icon||'check',(icon==='loader'?'spin ':'')+(color||'c-am'));
  t.style.borderColor={'c-am':'#fbbf24','c-cy':'#22d3ee','c-pk':'#f87171','c-mut':'#64748b'}[color||'c-am']||'#fbbf24';
  t.className='toast show';
  clearTimeout(toastT);
  toastT=setTimeout(function(){t.className='toast';},2300);
}

/* ==================== RENDER ==================== */
function posterHTML(s,ctx){
  var tv=s.category==='tv';
  return '<a class="f poster" href="'+esc(openUrl(s))+'" data-act="open" data-id="'+s.id+'" data-fk="'+ctx+':'+s.id+'" style="'+avatar(s.id)+'" aria-label="'+esc(aria(s))+'">'
    +'<span class="pt">'+(tv?'LIVE TV':'MEDIA')+'</span>'+(isFav(s.id)?ico('star','pf fill'):'')
    +'<span><span class="pi">'+esc(s.isp)+'</span><span class="pn">'+esc(s.name)+'</span></span></a>';
}
function cardHTML(s){
  var tv=s.category==='tv',url=openUrl(s),n=s._all.length;
  return '<div class="item"><a class="f card" href="'+esc(url)+'" data-act="open" data-id="'+s.id+'" data-fk="g:'+s.id+'" aria-label="'+esc(aria(s))+'">'
    +'<span class="av" style="'+avatar(s.id)+'">'+esc(initials(s.name))+'<span class="avb '+(tv?'tv':'md')+'">'+ico(tv?'tv':'folder')+'</span></span>'
    +'<span class="cb"><span class="cn">'+(isFav(s.id)?ico('star','nf fill'):'')+esc(s.name)+'</span>'
    +'<span class="ci">'+esc(s.isp)+'</span>'
    +'<span class="cl"><span class="ch">'+esc(label(url))+'</span>'+(n>1?'<span class="cc">'+n+' links</span>':'')+'</span></span></a>'
    +'<button class="f opt" data-act="menu" data-id="'+s.id+'" aria-label="Options for '+esc(s.name)+'">'+ico('more')+'</button></div>';
}
function filtered(){
  var terms=query?query.split(' '):[];
  var r=DATA.filter(function(s){
    if(cat==='favs'&&!isFav(s.id))return false;
    if(cat==='recent'&&recents.indexOf(s.id)<0)return false;
    if(cat==='ip'&&!s._ip)return false;
    if((cat==='media'||cat==='tv')&&s.category!==cat)return false;
    for(var i=0;i<terms.length;i++){if(s._hay.indexOf(terms[i])<0)return false;}
    return true;
  });
  if(cat==='recent')r.sort(function(a,b){return recents.indexOf(a.id)-recents.indexOf(b.id);});
  else if(cat==='favs')r.sort(function(a,b){return a.name.localeCompare(b.name);});
  return r;
}
function buildTabs(){
  $('tabs').innerHTML=TABS.map(function(t){
    return '<button class="f tab" id="t-'+t.k+'" role="tab" data-act="tab" data-k="'+t.k+'">'+ico(t.i,t.c)+t.l+'<span class="n" id="n-'+t.k+'">0</span></button>';
  }).join('');
}
function renderTabs(){
  var counts={all:DATA.length,
    media:DATA.filter(function(s){return s.category==='media';}).length,
    tv:DATA.filter(function(s){return s.category==='tv';}).length,
    ip:DATA.filter(function(s){return s._ip;}).length,
    favs:favs.length,recent:recents.length};
  TABS.forEach(function(t){
    var b=$('t-'+t.k);
    b.classList.toggle('on',t.k===cat);
    b.setAttribute('aria-selected',t.k===cat?'true':'false');
    $('n-'+t.k).textContent=counts[t.k];
  });
}
function renderRails(){
  var show=cat==='all'&&!query;
  var defs=[
    ['recentSec','recentRail','rr',recents.map(function(id){return BY[id];})],
    ['favSec','favRail','rf',favs.slice().reverse().slice(0,12).map(function(id){return BY[id];})],
    ['pickSec','pickRail','rp',PICKS.map(function(id){return BY[id];}).filter(Boolean)]
  ];
  defs.forEach(function(d){
    var on=show&&d[3].length>0;
    $(d[0]).hidden=!on;
    if(on)$(d[1]).innerHTML=d[3].map(function(s){return posterHTML(s,d[2]);}).join('');
  });
}
function renderGrid(){
  var r=filtered(),links=0;
  r.forEach(function(s){links+=s._all.length;});
  $('gridTitle').innerHTML=query?'Results for “'+esc(query)+'”':esc(TITLES[cat]);
  $('meta').innerHTML='<b>'+r.length+'</b> providers · <b class="am">'+links+'</b> links';
  $('grid').innerHTML=r.map(cardHTML).join('');
  var e=$('empty');e.hidden=r.length>0;
  if(!r.length){
    var t='Nothing on this channel',p='No servers match your search or category.';
    if(!query&&cat==='favs'){t='No favorites yet';p='Hold OK on any server, then choose “Add to favorites”.';}
    if(!query&&cat==='recent'){t='Nothing opened yet';p='Servers you open will appear here.';}
    $('emptyT').textContent=t;$('emptyP').textContent=p;
    $('emptyB').hidden=(cat==='all'&&!query);
  }
}
function renderAll(){renderTabs();renderRails();renderGrid();}

/* ==================== ACTIONS ==================== */
function pushRecent(id){
  recents=[id].concat(recents.filter(function(r){return r!==id;})).slice(0,10);
  LS.set('bdix_hub_recent',recents);
}
function go(url,id,fk,pick){
  if(opening)return;
  var s=id?BY[id]:null;
  if(s){
    pushRecent(id);
    if(pick){if(url===s.url)delete prefs[id];else prefs[id]=url;LS.set('bdix_hub_pref',prefs);}
  }
  LS.set('bdix_hub_last',{fk:fk||'',cat:cat,q:query,y:window.pageYOffset,t:Date.now()});
  opening=true;
  toast('Opening '+(s?s.name:label(url))+'…','loader','c-cy');
  setTimeout(function(){window.location.href=url;},140);
}
function openCustom(){
  var el=$('u'),u=el.value.trim();
  if(!u){toast('Enter an IP or domain first','alert','c-pk');el.focus();return;}
  if(!/^[a-z][a-z0-9+.\-]*:\/\//i.test(u))u='http://'+u;
  try{new URL(u);}catch(e){toast('That address doesn’t look right','alert','c-pk');return;}
  go(u,null,'',false);
}
function focusKey(){
  var a=document.activeElement,fk=a&&a.getAttribute?a.getAttribute('data-fk'):null;
  var cards=Array.prototype.slice.call($('grid').querySelectorAll('.card'));
  return {fk:fk,idx:Math.max(0,cards.indexOf(a))};
}
function restoreFocus(f){
  var el=f&&f.fk?document.querySelector('[data-fk="'+f.fk+'"]'):null;
  if(!el){
    var cards=$('grid').querySelectorAll('.card');
    el=cards.length?cards[Math.min(f?f.idx:0,cards.length-1)]:$('t-'+cat);
  }
  focusEl(el);
}
function toggleFav(id){
  var i=favs.indexOf(id),f=focusKey();
  if(i<0){favs.push(id);toast('Added to Favorites','star','c-am');}
  else{favs.splice(i,1);toast('Removed from Favorites','star','c-mut');}
  LS.set('bdix_hub_favs',favs);
  renderAll();
  if(ovOpen&&ovKind==='d'){updateFavBtn();}
  else restoreFocus(f);
}
function setCat(k){cat=k;renderAll();}
function applyQuery(){
  query=$('q').value.toLowerCase().replace(/\s+/g,' ').trim();
  $('clr').hidden=!query;
  renderAll();
}
function clearSearch(){$('q').value='';applyQuery();$('q').focus();}
function resetFilters(){$('q').value='';query='';$('clr').hidden=true;cat='all';renderAll();focusEl($('t-all'));}

/* ==================== OVERLAYS ==================== */
function favBtnHTML(on){return ico('star','fill'+(on?' am':''))+(on?'Favorited':'Add to favorites');}

var ovId=null;
function detailsHTML(s){
  var tv=s.category==='tv',def=openUrl(s);
  var rows=s._all.map(function(u){
    var isDef=u===def,https=/^https:/i.test(u),ip=IPRE.test(u);
    return '<a class="f lr'+(isDef?' def':'')+'" href="'+esc(u)+'" data-act="open" data-id="'+s.id+'" data-pick="1" data-fk="">'
      +ico(https?'lock':'server','li')+'<span class="lt">'+esc(label(u))+'</span>'
      +'<span class="lg">'+(ip?'<em class="tg ip">IP</em>':'')+(https?'<em class="tg hs">HTTPS</em>':'')+(isDef?'<em class="tg df">DEFAULT</em>':'')+'</span></a>';
  }).join('');
  return '<div class="ph"><span class="av lg" style="'+avatar(s.id)+'">'+esc(initials(s.name))+'</span>'
    +'<div class="pht"><h2 id="ovTitle">'+esc(s.name)+'</h2><p>'+esc(s.isp)+' · '+(tv?'Live TV':'Media / FTP')+'</p></div>'
    +'<div class="pha"><button class="f btn" id="favBtn" data-act="fav" data-id="'+s.id+'">'+favBtnHTML(isFav(s.id))+'</button>'
    +'<button class="f btn ghost" data-act="close">'+ico('x')+'Close</button></div></div>'
    +'<div class="lh2">'+(s._all.length>1?'All links <b>'+s._all.length+'</b><span>The one you open becomes this server’s default.</span>':'Link')+'</div>'
    +'<div class="links">'+rows+'</div>'
    +(prefs[s.id]?'<div class="pfoot"><button class="f btn ghost" data-act="resetpref" data-id="'+s.id+'">'+ico('reset')+'Reset default link</button></div>':'');
}
function settingsHTML(){
  var h='<div class="ph"><div class="pht" style="grid-column:1/3"><h2 id="ovTitle">Settings</h2><p>Tune the hub for your TV. Changes apply instantly.</p></div>'
    +'<div class="pha"><button class="f btn ghost" data-act="close">'+ico('x')+'Close</button></div></div>';
  SET.forEach(function(g){
    h+='<div class="srow"><div class="st"><b>'+g.t+'</b><small>'+g.d+'</small></div><div class="seg" role="group" aria-label="'+g.t+'">'
      +g.o.map(function(o){var on=cfg[g.k]===o[0];return '<button class="f sg'+(on?' on':'')+'" data-act="cfg" data-k="'+g.k+'" data-v="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>';}).join('')
      +'</div></div>';
  });
  h+='<div class="srow"><div class="st"><b>Data on this device</b><small>Favorites, history and default links never leave this TV.</small></div><div class="seg">'
    +'<button class="f sg" data-act="clr" data-w="recent">Clear recent ('+recents.length+')</button>'
    +'<button class="f sg" data-act="clr" data-w="favs">Clear favorites ('+favs.length+')</button></div></div>'
    +'<p class="about">'+DATA.length+' providers · '+TOTAL+' links · v3.0</p>';
  return h;
}
function showOv(kind,html,focusSel){
  ovFrom=focusKey();ovFrom.el=document.activeElement;
  ovKind=kind;ovOpen=true;
  $('panel').innerHTML=html;$('panel').scrollTop=0;$('ov').hidden=false;
  var el=$('panel').querySelector(focusSel)||$('panel').querySelector('.f');
  focusEl(el);setHints('ov');
}
function openDetails(id){var s=BY[id];if(!s)return;ovId=id;showOv('d',detailsHTML(s),'.lr.def');}
function openSettings(){ovId=null;showOv('s',settingsHTML(),'.sg.on');}
function closeOv(){
  if(!ovOpen)return;
  ovOpen=false;$('ov').hidden=true;
  if(ovKind==='s')focusEl($('gear'));
  else restoreFocus(ovFrom);
  setHints(ctxOf(document.activeElement));
}

/* ==================== FOCUS + SCROLL ==================== */
function ctxOf(el){
  if(ovOpen)return 'ov';
  if(!el||!el.classList)return 'nav';
  if(el.tagName==='INPUT')return 'inp';
  if(el.classList.contains('card')||el.classList.contains('poster'))return 'card';
  return 'nav';
}
function setHints(c){
  $('hintList').innerHTML=HINTS[c].map(function(h){return '<span class="hk"><kbd>'+h[0]+'</kbd>'+h[1]+'</span>';}).join('');
}
var pendY=0,pendT=0,smoothOK='scrollBehavior' in document.documentElement.style;
function ensureVisible(el){
  if(ovOpen){
    var p=$('panel'),r=el.getBoundingClientRect(),pr=p.getBoundingClientRect();
    if(r.top<pr.top+12)p.scrollTop-=pr.top+12-r.top;
    else if(r.bottom>pr.bottom-12)p.scrollTop+=r.bottom-pr.bottom+12;
    return;
  }
  var rail=el.closest('.rail');
  if(rail){
    var rr=rail.getBoundingClientRect(),er=el.getBoundingClientRect();
    var pad=parseFloat(getComputedStyle(rail).paddingLeft)||0,dx=0;
    if(er.left<rr.left+pad)dx=er.left-(rr.left+pad)-er.width*.3;
    else if(er.right>rr.right-pad)dx=er.right-(rr.right-pad)+er.width*.3;
    if(dx)rail.scrollLeft+=dx;
  }
  var vh=window.innerHeight,cur=window.pageYOffset,now=Date.now();
  var base=(now-pendT<400)?pendY:cur;
  var rc=el.getBoundingClientRect(),top=rc.top+(cur-base),bot=rc.bottom+(cur-base);
  var padT=16,padB=$('hints').offsetHeight+16,look=Math.min(rc.height*.4,90),y=base;
  if(el.closest('[data-top]'))y=0;
  else if(top<padT)y=base-(padT-top)-look;
  else if(bot>vh-padB)y=base+(bot-(vh-padB))+look;
  var max=Math.max(0,document.documentElement.scrollHeight-vh);
  y=Math.max(0,Math.min(max,y));
  if(y!==base&&y<80)y=0;
  if(Math.abs(y-cur)>1){
    pendY=y;pendT=now;
    if(smoothOK)window.scrollTo({top:y,left:0,behavior:cfg.fx?'smooth':'auto'});else window.scrollTo(0,y);
  }
}
function focusEl(el){
  if(!el)return;
  try{el.focus({preventScroll:true});}catch(e){el.focus();}
  ensureVisible(el);
}
function firstFocus(){
  if(ovOpen)return $('panel').querySelector('.f');
  return $('t-'+cat)||$('t-all');
}
/* Spatial D-pad navigation: nearest focusable in the pressed direction. */
function move(dir){
  var root=ovOpen?$('ov'):document,cur=document.activeElement;
  if(!cur||!cur.classList||!cur.classList.contains('f')||!root.contains(cur)){focusEl(firstFocus());return;}
  var list=root.querySelectorAll('.f'),a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;
  var best=null,bs=1e9,horiz=(dir==='left'||dir==='right');
  for(var i=0;i<list.length;i++){
    var el=list[i];if(el===cur)continue;
    var r=el.getBoundingClientRect();if(!r.width&&!r.height)continue;
    var cx=r.left+r.width/2,cy=r.top+r.height/2,d,along,gap,off;
    if(horiz){
      d=dir==='right'?cx-ax:ax-cx;if(d<=4)continue;
      along=dir==='right'?r.left-a.right:a.left-r.right;
      gap=Math.max(0,Math.max(a.top,r.top)-Math.min(a.bottom,r.bottom));off=Math.abs(cy-ay);
    }else{
      d=dir==='down'?cy-ay:ay-cy;if(d<=4)continue;
      along=dir==='down'?r.top-a.bottom:a.top-r.bottom;
      gap=Math.max(0,Math.max(a.left,r.left)-Math.min(a.right,r.right));off=Math.abs(cx-ax);
    }
    if(along<0)along=0;
    var sc=along+d*.2+gap*5+off*.6;
    if(sc<bs){bs=sc;best=el;}
  }
  if(best)focusEl(best);
}

/* ==================== BACK BUTTON ==================== */
/* Returns true when Back did something inside the hub; false when the hub is already at "home". */
function handleBack(){
  var a=document.activeElement;
  if(ovOpen){closeOv();return true;}
  if(a&&a.tagName==='INPUT'){a.blur();focusEl($('t-'+cat));return true;}
  if(window.pageYOffset>20){focusEl($('t-'+cat));window.scrollTo(0,0);return true;}
  if(query||cat!=='all'){resetFilters();return true;}
  if(a!==$('t-all')){focusEl($('t-all'));return true;}
  return false;
}
window.addEventListener('popstate',function(e){
  if(e.state&&e.state.hub===1){
    if(handleBack())history.pushState({hub:2},'');
    else history.back();
  }
});
(function armHistory(){
  var st=history.state;
  try{
    if(!st||!st.hub){history.replaceState({hub:1},'');history.pushState({hub:2},'');}
    else if(st.hub===1){history.pushState({hub:2},'');}
  }catch(e){}
})();

/* ==================== INPUT ==================== */
var okT=null,okEl=null,okLong=false;
document.addEventListener('keydown',function(e){
  document.body.classList.remove('mouse');
  var k=e.key,kc=e.keyCode,a=document.activeElement,inp=a&&a.tagName==='INPUT';
  var isOK=(k==='Enter'||kc===13||kc===23||k==='Select');
  var dir=KEYDIR[k]||KEYDIR[kc];

  if(isOK&&e.repeat){e.preventDefault();return;}

  if(k==='Escape'||k==='GoBack'||k==='BrowserBack'||kc===4||(k==='Backspace'&&!inp)){
    e.preventDefault();
    if(!handleBack()&&(k==='GoBack'||k==='BrowserBack'||kc===4))history.back();
    return;
  }
  if(k==='ContextMenu'||k==='Menu'||kc===82){
    e.preventDefault();
    var c=a&&a.closest?a.closest('.card,.poster'):null;
    if(ovOpen)closeOv();else if(c)openDetails(c.getAttribute('data-id'));else openSettings();
    return;
  }
  if(dir){
    if(inp&&(dir==='left'||dir==='right')){
      var atStart=a.selectionStart===0&&a.selectionEnd===0,atEnd=a.selectionStart===a.value.length;
      if(!(dir==='left'?atStart:atEnd))return;
    }
    e.preventDefault();move(dir);return;
  }
  if(isOK){
    if(inp){
      if(a._typed&&a.id==='u'){e.preventDefault();openCustom();}
      else if(a._typed&&a.id==='q'){e.preventDefault();a.blur();var f=$('grid').querySelector('.card')||$('t-'+cat);focusEl(f);}
      return;
    }
    var t=a&&a.closest?a.closest('.card,.poster'):null;
    if(t&&!ovOpen){
      /* short press = open, hold = mirrors & favorite */
      e.preventDefault();okEl=t;okLong=false;clearTimeout(okT);
      okT=setTimeout(function(){okLong=true;openDetails(t.getAttribute('data-id'));},520);
    }
    return;
  }
  if(inp)return;
  if(k==='/'||k==='s'||k==='S'){e.preventDefault();focusEl($('q'));}
  else if(k==='f'||k==='F'){var c2=a&&a.closest?a.closest('.card,.poster'):null;if(c2)toggleFav(c2.getAttribute('data-id'));}
  else if(k>='1'&&k<='6'){setCat(TABS[parseInt(k,10)-1].k);focusEl($('t-'+cat));}
});
document.addEventListener('keyup',function(e){
  var isOK=(e.key==='Enter'||e.keyCode===13||e.keyCode===23||e.key==='Select');
  if(!isOK||!okEl)return;
  clearTimeout(okT);
  var t=okEl,long=okLong;okEl=null;okLong=false;
  if(!long&&document.activeElement===t)go(t.getAttribute('href'),t.getAttribute('data-id'),t.getAttribute('data-fk'),false);
});
document.addEventListener('mousemove',function(){document.body.classList.add('mouse');});

var armT=null;
document.addEventListener('click',function(e){
  if(e.target===$('ov')){closeOv();return;}
  var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  switch(act){
    case 'open':e.preventDefault();go(el.getAttribute('href'),id,el.getAttribute('data-fk'),el.hasAttribute('data-pick'));break;
    case 'menu':openDetails(id);break;
    case 'fav':toggleFav(id);break;
    case 'close':closeOv();break;
    case 'tab':setCat(el.getAttribute('data-k'));break;
    case 'go':openCustom();break;
    case 'clrq':clearSearch();break;
    case 'reset':resetFilters();break;
    case 'settings':openSettings();break;
    case 'resetpref':delete prefs[id];LS.set('bdix_hub_pref',prefs);renderAll();$('panel').innerHTML=detailsHTML(BY[id]);focusEl($('panel').querySelector('.lr.def'));toast('Default link reset','reset','c-cy');break;
    case 'cfg':
      var key=el.getAttribute('data-k');cfg[key]=Number(el.getAttribute('data-v'));LS.set('bdix_hub_cfg',cfg);applyCfg();
      Array.prototype.forEach.call(el.parentNode.children,function(b){var on=b===el;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
      break;
    case 'clr':
      var w=el.getAttribute('data-w');
      if(el.getAttribute('data-arm')!=='1'){
        el.setAttribute('data-arm','1');el.textContent='Press again to confirm';
        clearTimeout(armT);armT=setTimeout(function(){if(ovOpen&&ovKind==='s')$('panel').innerHTML=settingsHTML();},3000);
      }else{
        if(w==='recent'){recents=[];LS.set('bdix_hub_recent',recents);}else{favs=[];LS.set('bdix_hub_favs',favs);}
        renderAll();$('panel').innerHTML=settingsHTML();toast(w==='recent'?'Recent history cleared':'Favorites cleared','check','c-am');
        focusEl($('panel').querySelector('.sg.on'));
      }
      break;
  }
});

var qT;
$('q').addEventListener('input',function(){this._typed=true;clearTimeout(qT);qT=setTimeout(applyQuery,140);});
$('u').addEventListener('input',function(){this._typed=true;});
document.addEventListener('focusin',function(e){
  if(e.target.tagName==='INPUT')e.target._typed=false;
  setHints(ctxOf(e.target));
});

/* Coming back from a server (Back button): the page may be restored from cache or reloaded. */
window.addEventListener('pageshow',function(e){
  opening=false;$('toast').className='toast';
  if(e.persisted){renderAll();var l=LS.get('bdix_hub_last',null);if(l&&l.fk){var el=document.querySelector('[data-fk="'+l.fk+'"]');if(el)focusEl(el);}}
});

/* ==================== INIT ==================== */
applyCfg();tick();setInterval(tick,15000);
buildTabs();
(function init(){
  var nav=window.performance&&performance.getEntriesByType?performance.getEntriesByType('navigation')[0]:null;
  var back=nav?nav.type==='back_forward':(performance.navigation&&performance.navigation.type===2);
  var last=LS.get('bdix_hub_last',null);
  if(back&&last&&Date.now()-last.t<12*3600*1000){
    cat=last.cat||'all';query=last.q||'';
    $('q').value=query;$('clr').hidden=!query;
  }
  renderAll();
  var target=null;
  if(back&&last&&last.fk){target=document.querySelector('[data-fk="'+last.fk+'"]');}
  if(target){window.scrollTo(0,last.y||0);focusEl(target);}
  else focusEl($('t-'+cat));
  setHints(ctxOf(document.activeElement));
})();
})();
</script>
